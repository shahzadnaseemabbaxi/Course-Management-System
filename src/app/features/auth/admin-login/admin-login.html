<div class="login-page">

  <div class="login-card">

    <a routerLink="/login" class="back-btn">← Back</a>

    <div class="logo-section">
      <div class="logo-icon">👤</div>
      <h1>Admin Login</h1>
      <p>Enter your credentials to continue</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form" autocomplete="on">

      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          placeholder="Enter username"
          formControlName="username"
          [class.error]="isInvalid('username')"
          autocomplete="username"
          name="username"
          readonly 
          (focus)="$event.target.removeAttribute('readonly')"
          (blur)="$event.target.setAttribute('readonly', 'true')"
        />
        @if (isInvalid('username')) {
          <span class="error-msg">⚠ Username is required</span>
        }
      </div>

      <!-- ✅ Professional SVG Eye Icon -->
      <div class="form-group">
        <label>Password</label>
        
        <div style="position: relative; display: flex; align-items: center;">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="Enter password"
            formControlName="password"
            [class.error]="isInvalid('password')"
            autocomplete="current-password"
            name="password"
            readonly 
            (focus)="$event.target.removeAttribute('readonly')"
            (blur)="$event.target.setAttribute('readonly', 'true')"
            style="padding-right: 45px; width: 100%; box-sizing: border-box;"
          />
          
          <button 
            type="button" 
            (click)="togglePasswordVisibility()"
            style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; color: #6b7280; transition: color 0.2s;">
            
            @if (showPassword()) {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            }
          </button>
        </div>

        @if (isInvalid('password')) {
          <span class="error-msg">⚠ Password is required</span>
        }
      </div>

      @if (errorMessage()) {
        <div class="error-box">{{ errorMessage() }}</div>
      }

      <button type="submit" class="submit-btn" [disabled]="loading()">
        {{ loading() ? 'Logging in...' : 'Login' }}
      </button>

    </form>

    <!-- <div class="demo-creds">
      <p><strong>Demo Credentials:</strong></p>
      <p>Username: <code>admin</code></p>
      <p>Password: <code>admin123</code></p>
    </div> -->

  </div>

</div>
