<div class="login-page">

  <div class="login-card">

    <a routerLink="/login" class="back-btn">← Back</a>

    <div class="logo-section">
      <div class="logo-icon">👨‍🎓</div>
      <h1>Student Login</h1>
      <p>Enter your credentials to continue</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

      <div class="form-group">
        <label>Roll Number / Username</label>
        <input
          type="text"
          placeholder="Enter roll number"
          formControlName="username"
          [class.error]="isInvalid('username')"
        />
        @if (isInvalid('username')) {
          <span class="error-msg">⚠ Roll number is required</span>
        }
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          placeholder="Enter password"
          formControlName="password"
          [class.error]="isInvalid('password')"
        />
        @if (isInvalid('password')) {
          <span class="error-msg">⚠ Password is required</span>
        }
      </div>

      @if (errorMessage()) {
        <div class="error-box">{{ errorMessage() }}</div>
      }

      <button type="submit" class="submit-btn" [disabled]="loading()">
        {{ loading() ? 'Logging in...' : 'Login' }}
      </button>

    </form>

    <div class="demo-creds">
      <p><strong>Demo Credentials:</strong></p>
      <p>Roll No: <code>mahaz</code></p>
      <p>Password: <code>mahaz123</code></p>
    </div>

  </div>

</div>
