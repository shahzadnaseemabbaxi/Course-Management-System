<app-navbar (toggleSidebar)="toggleSidebar()"></app-navbar>

<div class="app-body">

  <!-- ✅ Overlay — sirf mobile pe jab expanded ho -->
  @if (isMobile() && sidebarExpanded()) {
    <div class="sidebar-overlay" (click)="closeSidebar()"></div>
  }

  <div class="sidebar-wrapper" [class.expanded]="sidebarExpanded()">
    <app-sidebar
      [collapsed]="isCollapsed()"
      (linkClicked)="closeSidebar()">
    </app-sidebar>
  </div>

  <main class="main-content" [class.dark]="themeService.isDarkMode()">
    <router-outlet></router-outlet>
  </main>

</div>
